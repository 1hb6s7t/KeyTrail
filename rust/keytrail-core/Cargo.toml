[package]
name = "keytrail-core"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "keytrail_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
