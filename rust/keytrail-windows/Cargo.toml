[package]
name = "keytrail-windows"
version = "1.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
keytrail-core = { path = "../keytrail-core" }
keytrail-server = { path = "../keytrail-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.32"
aes-gcm = "0.10"
base64 = "0.22"
unicode-segmentation = "1.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange"] }

windows = { version = "0.58", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
