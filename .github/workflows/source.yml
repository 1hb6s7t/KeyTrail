name: Source publication checks
on:
  workflow_dispatch:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication boundaries
        run: python3 -m unittest discover -s Tests/PublicationChecks -v
      - name: Scan public source selection
        run: python3 scripts/export-source.py --check
